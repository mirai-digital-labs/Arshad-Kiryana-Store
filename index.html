async function toWebp(f){if(!f)throw 0;let src;try{src=await createImageBitmap(f)}catch(e){src=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(f)})}
const w=src.width||src.naturalWidth,h=src.height||src.naturalHeight,m=Math.min(w,h),c=document.createElement('canvas');c.width=c.height=Math.min(320,m);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(src,(w-m)/2,(h-m)/2,m,m,0,0,c.width,c.height);let u=c.toDataURL('image/webp',.78);if(u.indexOf('data:image/webp')!=0)u=c.toDataURL('image/jpeg',.8);return u}
async function upimg(f){try{np=await toWebp(f);$('imi').textContent='✓ Photo ready · '+Math.round(np.length*.75/1024)+' KB';toast('✓ Photo ready')}catch(e){toast('Photo load nahi hui / Could not read photo')}}

function setChip(id,instant){cc=id;const c=$('chips');document.querySelectorAll('#chips .chip').forEach(b=>{const on=b.dataset.i==id;b.classList.toggle('on',on);if(on&&c){const cr=c.getBoundingClientRect(),br=b.getBoundingClientRect(),d=(br.left+br.width/2)-(cr.left+cr.width/2);if(Math.abs(d)>6)c.scrollBy({left:d,behavior:instant?'auto':'smooth'})}})}

function spy(){if(q.trim()||!$('chips')||Date.now()<lock)return;const o=offs()+8;let cur='all';document.querySelectorAll('.sec').forEach(h=>{if(h.getBoundingClientRect().top<=o)cur=h.id.slice(2)});if(cur!=cc)setChip(cur)}
function initChips(){const c=$('chips');if(!c)return;
c.onmousedown=e=>{let sx=e.clientX,sl=c.scrollLeft;drg=0;const mv=ev=>{const dx=ev.clientX-sx;if(Math.abs(dx)>4)drg=1;c.scrollLeft=sl-dx},up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);setTimeout(()=>drg=0,60)};addEventListener('mousemove',mv);addEventListener('mouseup',up)};
c.onwheel=e=>{if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){c.scrollLeft+=(getComputedStyle(c).direction=='rtl'?-1:1)*e.deltaY;e.preventDefault()}};
setChip(cc,1)}

const L=lines(),fee=D.shop.fee,o={id:'o'+Date.now(),code:Math.random().toString(36).slice(2,6).toUpperCase(),n,p,a:ad,items:L.map(l=>({ur:l.p.ur,en:l.p.en,q:l.q,u:l.p.unit,t:l.t})),fee,total:sub()+fee,st:'new',t:Date.now()};
